<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Previsualització · Sessió diària</title><link rel="stylesheet" href="daily-session.css"></head>
<body class="preview-page"><header class="daily-top"><a class="daily-brand" href="daily-session.html"><b>FQ</b> Previsualització docent</a><span>No desa ni llegeix perfils</span></header>
<main id="previewViewport" class="daily-shell preview-shell"><section class="daily-card"><p class="kicker">Eina de desenvolupament aïllada</p><h1>Inspecció de la sessió</h1>
<form class="preview-controls" onsubmit="return false">
<label>Vista<select id="previewMode"><option value="activity">Activitat autònoma</option><option value="lesson">Microlliçó</option><option value="guided">Exemple guiat</option><option value="attempt">Intent i ajuda</option><option value="prerequisite">Prerequisit</option><option value="summary">Resum final</option></select></label>
<label>Habilitat<select id="previewSkill"></select></label><label>Procediment<select id="previewProcedure"></select></label><label>Format<select id="previewFormat"></select></label>
<label>Nivell<select id="previewLevel"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
<label>Estat de l’intent<select id="previewAttempt"><option value="fresh">Sense resposta</option><option value="specific-error">Error específic</option><option value="generic-error">Error genèric</option><option value="second-attempt">Segon intent</option><option value="solution">Solució consultada</option><option value="verification">Comprovació posterior</option></select></label>
<label>Ajuda visible<select id="previewHelpState"><option value="none">Cap</option><option value="hint1">Primera pista</option><option value="hint2">Segona ajuda</option><option value="solution">Solució</option></select></label>
<label>Amplada<select id="previewWidth"><option value="desktop">Escriptori</option><option value="mobile">Mòbil (390 px)</option></select></label>
<button id="previewNew" class="primary" type="button">Genera una variant nova</button></form>
<hr><p id="previewMeta" class="reason" aria-live="polite"></p><section id="previewStage" aria-label="Previsualització"><div id="previewQuestion" class="question"></div><div id="previewChoices" class="answer-choices"></div><div id="previewFeedback" class="feedback" aria-live="polite"></div><div id="previewHelp" class="support" hidden></div></section>
</section></main>
<script src="daily-session-engine.js"></script><script src="daily-prerequisites.js"></script><script src="daily-summary.js"></script><script src="daily-lessons.js"></script><script src="math.js"></script><script src="daily-activity-bank.js"></script><script src="daily-preview.js"></script></body></html>
