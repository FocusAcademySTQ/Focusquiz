<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sessió diària · FocusQuiz</title><link rel="stylesheet" href="daily-session.css"></head>
<body><header class="daily-top"><a href="app.html" class="daily-brand"><b>FQ</b> FocusQuiz</a><span>Perfil local en aquest dispositiu</span></header>
<main class="daily-shell">
  <section id="intro" class="daily-card"><p class="kicker">10–15 minuts · sense compte enrere</p><h1>Sessió diària</h1><p>Un recorregut adaptatiu que comença per fraccions i el càlcul que necessites. No cal escollir curs ni nivell.</p><div id="coverage"></div><button id="start" class="primary">Comença o reprèn</button></section>
  <section id="activity" class="daily-card" hidden><div class="activity-head"><span id="phase" class="badge"></span><span id="step"></span></div><div class="progress"><i id="bar"></i></div><p id="reason" class="reason"></p><h2 id="skill"></h2><div id="question" class="question"></div><form id="answerForm"><label for="answer">La teva resposta</label><input id="answer" autocomplete="off" inputmode="text" required><button class="primary">Comprova</button></form><div class="help-actions"><button id="hint" class="secondary" type="button">Dona’m una pista</button><button id="solution" class="link-button" type="button">Mostra un exemple resolt</button></div><div id="support" class="support" hidden></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="primary" hidden>Continua</button></section>
  <section id="summary" class="daily-card" hidden><p class="kicker">Sessió completada</p><h1>El teu progrés d’avui</h1><div id="summaryBody"></div><button id="newSession" class="primary">Torna demà a comprovar-ho</button><a class="free-link" href="app.html">Anar a la pràctica lliure</a></section>
</main><script src="daily-session-engine.js"></script><script src="math.js"></script><script src="daily-session-ui.js"></script></body></html>
