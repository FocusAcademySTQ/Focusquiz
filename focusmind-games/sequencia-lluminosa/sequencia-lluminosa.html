<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seqüència lluminosa · FocusMind</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/focusmind.css" />
  <link rel="stylesheet" href="./sequencia-lluminosa.css" />
  <link rel="stylesheet" href="../shared-setup.css" />
</head>
<body class="focusmind-game-page">
  <main id="sequenciaLluminosaApp" class="sequencia-lluminosa" aria-label="Seqüència lluminosa">
    <section id="sequenciaIntro" class="sequencia-lluminosa__card fm-unified-setup">
      <div class="fm-setup-copy">
      <p class="sequencia-lluminosa__kicker fm-setup-kicker">FocusMind · Memòria</p>
      <h1 id="sequenciaLluminosaTitle">Seqüència lluminosa</h1>
      <p class="sequencia-lluminosa__lead fm-setup-lead">
        Observa l'ordre en què s'il·luminen les caselles i reprodueix la seqüència. Cada encert posa una mica més a prova la teva memòria.
      </p>
      <div class="sequencia-lluminosa__actions fm-setup-actions">
        <button id="sequenciaStart" class="fm-btn fm-setup-primary" type="button">Començar partida</button>
        <a class="fm-btn secondary fm-setup-secondary" href="/focusmind">Tornar a FocusMind</a>
      </div>
      </div>
      <div class="fm-setup-visual" aria-hidden="true"><span>🟦</span><span>🟨</span><span>🟩</span><span>🟪</span></div>
    </section>

    <section id="sequenciaStage" class="sequencia-lluminosa__stage" aria-labelledby="sequenciaPlayTitle" hidden>
      <h2 id="sequenciaPlayTitle">Seqüència lluminosa</h2>
      <p id="sequenciaStatus" class="sequencia-lluminosa__status" role="status" tabindex="-1"></p>
      <div id="sequenciaBoard" class="sequencia-lluminosa__board" role="group" aria-label="Caselles de colors">
        <button class="sequencia-lluminosa__pad" type="button" aria-label="Blau">1</button>
        <button class="sequencia-lluminosa__pad" type="button" aria-label="Taronja">2</button>
        <button class="sequencia-lluminosa__pad" type="button" aria-label="Verd">3</button>
        <button class="sequencia-lluminosa__pad" type="button" aria-label="Lila">4</button>
      </div>
      <div class="sequencia-lluminosa__actions">
        <button id="sequenciaReplay" class="fm-btn" type="button" hidden>Tornar a jugar</button>
        <a class="fm-btn secondary" href="/focusmind">Tornar a FocusMind</a>
      </div>
    </section>
  </main>

  <script src="/focusmind.js" defer></script>
  <script src="./sequencia-lluminosa.js" defer></script>
</body>
</html>
